[build]
  command = "CI= yarn run build"
  publish = "dist"

# ---------------------------------------------------------------------------
# Redirects for the retired programmatic pages.
#
# These live here rather than in public/_redirects on purpose. Netlify parses
# netlify.toml as part of the build config and fails the build on an invalid
# rule, so a broken or missing rule is loud instead of silent — a file-based
# _redirects that never reaches the deploy fails quietly, which is exactly
# what happened before.
#
# Note there is deliberately NO catch-all. This file previously ended with a
# `/*` -> `/index.html` rule at status 200, which served the homepage for
# every URL that did not exist (a soft 404) and overrode every rule below it.
# Unknown URLs now fall through to dist/404.html with a real 404.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/calculators/quadratic-equation/*"
  to = "/calculators/quadratic-equation"
  status = 301

