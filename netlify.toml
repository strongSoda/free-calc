[build]
  command = "CI= yarn run build"
  publish = "dist"

# Generated by scripts/build-redirects.mjs from src/data/redirects.js.
# Do not edit by hand - your changes will be overwritten by the next build.
#
# There is deliberately no "/*" catch-all: a rule sending every unmatched URL
# to /index.html with status 200 served the homepage as a soft 404 for any URL
# that did not exist, and overrode every other rule.

[[redirects]]
  from = "/calculators"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/calculators/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/blog"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/blog/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/tools"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/hackathon"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/sitemap"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/test.html"
  to = "/404.html"
  status = 410

[[redirects]]
