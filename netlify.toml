[build]
  command = "CI= yarn run build"
  publish = "dist"

# Redirects live in public/_redirects, which the build copies to dist/.
#
# Netlify processes rules from netlify.toml BEFORE those in _redirects, so
# keeping some here and some there means the file you are reading may not be
# the one that wins. They are deliberately consolidated in _redirects.
#
# In particular, this file used to end with:
#
#   [[redirects]]
#     from = "/*"
#     to = "/index.html"
#     status = 200
#
# That served the homepage, with a 200, for every URL that did not exist — a
# soft 404 across an unbounded URL space, and it silently overrode the
# _redirects rules. Unknown URLs now fall through to dist/404.html with a
# real 404 status.
